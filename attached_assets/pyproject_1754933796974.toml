[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conversor-sites"
version = "0.1.0"
description = "Converte páginas web em PDF mantendo vídeos como links no lugar e salvando em output/ com o título da página."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Leandro", email = "lscecilio@gmail.com" }]
dependencies = [
  "playwright>=1.46.0",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.1",
]

[project.scripts]
conversor-sites = "conversor_sites.cli:app_main"

# 🔧 Desliga descoberta automática e inclui só o pacote certo
[tool.setuptools]
packages = ["conversor_sites"]

# (opcional) garante que nada de output/ entre no pacote
[tool.setuptools.package-data]
conversor_sites = []
