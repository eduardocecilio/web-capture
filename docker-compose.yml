services:
  web-capture:
    build: .
    container_name: web-capture
    init: true
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    environment:
      TZ: America/Sao_Paulo
    deploy:
      resources:
        limits:
          memory: 1G
    shm_size: '1gb'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      proxy_net:
        aliases:
          - web-capture

networks:
  proxy_net:
    external: true
    name: proxy_net
