services:
  web-capture:
    build: .
    container_name: web-capture
    restart: always
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-3000}:3000"
    deploy:
      resources:
        limits:
          memory: 1G
    shm_size: '1gb'

networks:
  default:
    name: ${NETWORK_NAME:-web-capture_default}
