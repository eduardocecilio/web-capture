<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web-Capture - Conversor Profissional</title>
    
    <link href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    <link href="./static/css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="./index.html">
                <i data-feather="camera" class="me-2 text-primary"></i>
                Web-Capture
            </a>
        </div>
    </nav>

    <main class="container my-5">
        <div id="alertContainer"></div>

        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card shadow-lg border-0">
                    <div class="card-header bg-primary py-3">
                        <h5 class="card-title mb-0 text-white">
                            <i data-feather="globe" class="me-2"></i>
                            Capturar Página Web
                        </h5>
                    </div>
                    <div class="card-body p-4">
                        <p class="text-muted mb-4">
                            Converta qualquer site em PDF de alta qualidade usando nosso motor de renderização via Puppeteer.
                        </p>

                        <form id="convertForm">
                            <div class="mb-3">
                                <label for="url" class="form-label fw-bold">URL da Página *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-primary">
                                        <i data-feather="link"></i>
                                    </span>
                                    <input type="url" class="form-control border-secondary" id="url" name="url" 
                                           placeholder="https://exemplo.com" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold d-block">Formatos de Saída *</label>
                                <div class="btn-group w-100" role="group">
                                    <input type="checkbox" class="btn-check" id="downloadPdfCheckbox" checked autocomplete="off">
                                    <label class="btn btn-outline-primary" for="downloadPdfCheckbox">
                                        <i data-feather="file" class="me-1"></i> PDF
                                    </label>

                                    <input type="checkbox" class="btn-check" id="downloadHtmlCheckbox" checked autocomplete="off">
                                    <label class="btn btn-outline-info" for="downloadHtmlCheckbox">
                                        <i data-feather="code" class="me-1"></i> HTML
                                    </label>
                                </div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg fw-bold" id="submitBtn">
                                    <i data-feather="play-circle" class="me-2"></i>
                                    Iniciar Conversão
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card mt-4 shadow" id="progressCard" style="display: none;">
                    <div class="card-body">
                        <div class="d-flex align-items-center mb-3">
                            <div class="spinner-border text-primary me-3" role="status"></div>
                            <h6 class="mb-0" id="progressMessage">Processando...</h6>
                        </div>
                        <div class="progress" style="height: 10px;">
                            <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary" 
                                 id="progressBar" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <div class="card mt-4 shadow border-success" id="resultsCard" style="display: none;">
                    <div class="card-header bg-success text-white py-3">
                        <h6 class="card-title mb-0">
                            <i data-feather="check-circle" class="me-2"></i>
                            Tudo pronto!
                        </h6>
                    </div>
                    <div class="card-body">
                        <div id="downloadButtonsContainer" class="d-grid gap-2">
                            </div>
                        <hr>
                        <button class="btn btn-link btn-sm text-muted w-100" onclick="window.resetForm()">
                            Converter outra página
                        </button>
                    </div>
                </div>

                <div class="card mt-4 shadow border-danger" id="errorCard" style="display: none;">
                    <div class="card-body text-center py-4">
                        <i data-feather="alert-triangle" class="text-danger mb-3" style="width: 48px; height: 48px;"></i>
                        <h5 class="text-danger">Ocorreu um erro</h5>
                        <p id="errorMessage" class="small text-muted"></p>
                        <button class="btn btn-outline-danger btn-sm" onclick="window.resetForm()">Tentar Novamente</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="container text-center text-muted mt-5 pb-4">
        <small>&copy; 2026 Web-Capture - Eduardo Cecilio | Projeto Ciência da Computação</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./static/js/app.js"></script>
    <script>
        feather.replace();
        // Garante que o resetForm recarregue a página caso não esteja no app.js
        window.resetForm = window.resetForm || function() { window.location.reload(); };
    </script>
</body>
</html>
